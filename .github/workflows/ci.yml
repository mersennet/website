name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: typecheck, static export, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Export produced the pages
        run: test -f out/index.html && test -f out/sitemap.xml && echo "static export ok"
      - run: npm audit --audit-level=high
